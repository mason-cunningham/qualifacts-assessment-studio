# Used once the repo is connected to Netlify (set the site's base directory to the repo root).
# For drag-and-drop deploys, public/_redirects is copied into dist/ and does the same job.
[build]
  base = "/"
  command = "npm install && npm run build:runner"
  publish = "apps/runner/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
